[project]
name = "sim-plan-poc"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "google-adk[mcp]>=2.9.2",
    "litellm>=1.55",
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "httpx>=0.27",
    "chromadb>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["prepaid_agent", "backend"]
